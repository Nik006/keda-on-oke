apiVersion: v1
kind: Namespace
metadata:
  name: nlb-keda-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: nlb-keda-test
  labels:
    app: echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: docker.io/hashicorp/http-echo:1.0
          args:
            - -text=hello from OKE
          ports:
            - name: http
              containerPort: 5678
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: echo-nlb
  namespace: nlb-keda-test
  annotations:
    oci.oraclecloud.com/load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: echo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
