apiVersion: v1
kind: ServiceAccount
metadata:
  name: oci-nlb-metrics-adapter
  namespace: nlb-keda-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oci-nlb-metrics-adapter-code
  namespace: nlb-keda-test
data:
  adapter.py: |
    import json
    import os
    import time
    from datetime import datetime, timedelta, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    import oci

    CACHE_SECONDS = 60
    cache = {"expires": 0, "value": None}

    signer = oci.auth.signers.get_oke_workload_identity_resource_principal_signer()
    monitoring = oci.monitoring.MonitoringClient(config={}, signer=signer)
    monitoring.base_client.set_region(os.environ["OCI_REGION"])

    def latest_new_connections():
        now = datetime.now(timezone.utc)
        if cache["value"] is not None and time.time() < cache["expires"]:
            return cache["value"]

        query = 'NewConnections[1m]{RESOURCEID = "' + os.environ["NLB_OCID"] + '"}.sum()'
        details = oci.monitoring.models.SummarizeMetricsDataDetails(
            namespace="oci_nlb",
            query=query,
            start_time=now - timedelta(minutes=3),
            end_time=now,
            resolution="1m",
        )
        response = monitoring.summarize_metrics_data(
            compartment_id=os.environ["COMPARTMENT_OCID"],
            summarize_metrics_data_details=details,
        )
        points = [point for stream in response.data for point in stream.aggregated_datapoints]
        if not points:
            raise RuntimeError("OCI Monitoring returned no NewConnections datapoint")
        value = float(max(points, key=lambda point: point.timestamp).value)
        cache.update({"expires": time.time() + CACHE_SECONDS, "value": value})
        return value

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                return
            if self.path != "/metrics/nlb":
                self.send_error(404)
                return
            try:
                body = json.dumps({"nlb": {"newConnectionsPerMinute": latest_new_connections()}}).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            except Exception as error:
                body = json.dumps({"error": str(error)}).encode()
                self.send_response(503)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

        def log_message(self, format, *args):
            return

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-nlb-metrics-adapter
  namespace: nlb-keda-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-nlb-metrics-adapter
  template:
    metadata:
      labels:
        app: oci-nlb-metrics-adapter
    spec:
      serviceAccountName: oci-nlb-metrics-adapter
      automountServiceAccountToken: true
      containers:
        - name: adapter
          image: docker.io/library/python:3.12-slim
          command:
            - /bin/sh
            - -ec
            - pip install --no-cache-dir oci==2.183.0 && exec python /app/adapter.py
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OCI_REGION
              value: us-ashburn-1
            - name: OCI_RESOURCE_PRINCIPAL_REGION
              value: us-ashburn-1
            - name: COMPARTMENT_OCID
              value: ocid1.compartment.oc1..aaaaaaaadygcczdelk66jbna3yydsuanlhcgp6sh34l7wggp4rcpc7qz67ga
            - name: NLB_OCID
              value: ocid1.networkloadbalancer.oc1.iad.amaaaaaalgiaqzyaibqi7e3e7fu632wk3a676x6p5krdcyzz2a4zlu2xs2na
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: oci-nlb-metrics-adapter-code
---
apiVersion: v1
kind: Service
metadata:
  name: oci-nlb-metrics-adapter
  namespace: nlb-keda-test
spec:
  selector:
    app: oci-nlb-metrics-adapter
  ports:
    - name: http
      port: 8080
      targetPort: http
