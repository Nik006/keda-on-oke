apiVersion: v1
kind: ServiceAccount
metadata:
  name: oci-nlb-metrics-adapter
  labels:
    app.kubernetes.io/name: {{ include "nlb-keda-demo.name" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oci-nlb-metrics-adapter-code
data:
  adapter.py: |
    import json
    import os
    import time
    from datetime import datetime, timedelta, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    import oci

    CACHE_SECONDS = 60
    cache = {"expires": 0, "value": None}

    signer = oci.auth.signers.get_oke_workload_identity_resource_principal_signer()
    monitoring = oci.monitoring.MonitoringClient(config={}, signer=signer)
    monitoring.base_client.set_region(os.environ["OCI_REGION"])
    nlb_client = oci.network_load_balancer.NetworkLoadBalancerClient(config={}, signer=signer)
    nlb_client.base_client.set_region(os.environ["OCI_REGION"])

    def nlb_ocid():
        matches = [
            item.id
            for item in nlb_client.list_network_load_balancers(os.environ["COMPARTMENT_OCID"]).data.items
            if getattr(item, "freeform_tags", {}).get(os.environ["NLB_TAG_KEY"]) == os.environ["NLB_TAG_VALUE"]
        ]
        if len(matches) != 1:
            raise RuntimeError("Expected exactly one tagged NLB, found " + str(len(matches)))
        return matches[0]

    def latest_new_connections():
        now = datetime.now(timezone.utc)
        if cache["value"] is not None and time.time() < cache["expires"]:
            return cache["value"]

        query = 'NewConnections[1m]{RESOURCEID = "' + nlb_ocid() + '"}.sum()'
        details = oci.monitoring.models.SummarizeMetricsDataDetails(
            namespace="oci_nlb",
            query=query,
            start_time=now - timedelta(minutes=3),
            end_time=now,
            resolution="1m",
        )
        response = monitoring.summarize_metrics_data(
            compartment_id=os.environ["COMPARTMENT_OCID"],
            summarize_metrics_data_details=details,
        )
        points = [point for stream in response.data for point in stream.aggregated_datapoints]
        if not points:
            raise RuntimeError("OCI Monitoring returned no NewConnections datapoint")
        value = float(max(points, key=lambda point: point.timestamp).value)
        cache.update({"expires": time.time() + CACHE_SECONDS, "value": value})
        return value

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                return
            if self.path != "/metrics/nlb":
                self.send_error(404)
                return
            try:
                body = json.dumps({"nlb": {"newConnectionsPerMinute": latest_new_connections()}}).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            except Exception as error:
                body = json.dumps({"error": str(error)}).encode()
                self.send_response(503)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

        def log_message(self, format, *args):
            return

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-nlb-metrics-adapter
  labels:
    app: oci-nlb-metrics-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-nlb-metrics-adapter
  template:
    metadata:
      labels:
        app: oci-nlb-metrics-adapter
    spec:
      serviceAccountName: oci-nlb-metrics-adapter
      automountServiceAccountToken: true
      containers:
        - name: adapter
          image: {{ .Values.adapter.image | quote }}
          command:
            - /bin/sh
            - -ec
            - pip install --no-cache-dir oci==2.183.0 && exec python /app/adapter.py
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OCI_REGION
              value: {{ required "ociRegion is required" .Values.ociRegion | quote }}
            - name: OCI_RESOURCE_PRINCIPAL_REGION
              value: {{ required "ociRegion is required" .Values.ociRegion | quote }}
            - name: COMPARTMENT_OCID
              value: {{ required "compartmentOcid is required" .Values.compartmentOcid | quote }}
            - name: NLB_TAG_KEY
              value: keda-solution
            - name: NLB_TAG_VALUE
              value: {{ required "nlbTagValue is required" .Values.nlbTagValue | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: oci-nlb-metrics-adapter-code
---
apiVersion: v1
kind: Service
metadata:
  name: oci-nlb-metrics-adapter
spec:
  selector:
    app: oci-nlb-metrics-adapter
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  labels:
    app: echo
spec:
  replicas: {{ .Values.scaling.minReplicas }}
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: {{ .Values.echo.image | quote }}
          args: ["-text=hello from OKE"]
          ports:
            - name: http
              containerPort: 5678
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: echo-nlb
  annotations:
    oci.oraclecloud.com/load-balancer-type: "nlb"
    oci.oraclecloud.com/initial-freeform-tags-override: '{"keda-solution":"{{ required "nlbTagValue is required" .Values.nlbTagValue }}"}'
spec:
  type: LoadBalancer
  selector:
    app: echo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: echo-nlb-traffic
spec:
  scaleTargetRef:
    name: echo
  minReplicaCount: {{ .Values.scaling.minReplicas }}
  maxReplicaCount: {{ .Values.scaling.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: metrics-api
      metadata:
        url: http://oci-nlb-metrics-adapter.nlb-keda-test.svc.cluster.local:8080/metrics/nlb
        format: json
        valueLocation: nlb.newConnectionsPerMinute
        targetValue: {{ .Values.scaling.connectionsPerReplica | quote }}
        timeout: 30s
